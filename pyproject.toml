[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Constrained LLM decoding for reliable function calling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=1.26",
    "pydantic>=2.7",
    "flake8==7.3.0",
    "mypy==2.3.0",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

[tool.mypy]
exclude = [
    "^llm_sdk/"
]